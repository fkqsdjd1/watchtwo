    <title>WatchTwo - Sign In</title>
    <meta name="description" content="Sign in to your WatchForGether account to start streaming movies and series.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <div class="auth-visual">
        <a href="index-2.html" class="visual-logo">Watch<span>Two</span></a>
        <div class="visual-content">
            <h1 class="visual-headline">Welcome Back</h1>
            <p class="visual-sub">
                Sign in to pick up where you left off. Your watchlist and favorites are waiting.
            </p>
        </div>
    </div>

    <div class="auth-form-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Sign In</h2>
                <p class="auth-subtitle">Enter your credentials to access your account.</p>
            </div>

            <form action="#" class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required="">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Enter your password" required="">
                        <span class="password-toggle" id="togglePassword">
                            <i class="fa-solid fa-eye" style="color:#8e8e93;font-size:16px;"></i>
                        </span>
                    </div>
                </div>

                <div class="form-options">
                    <label class="form-checkbox">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>

                <div class="divider">
                    <span>or</span>
                </div>


                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Create one</a>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    
    







    <script>if (localStorage.getItem('w4g_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');</script>
<script src="js/main.js"></script>
<script>
        var toggleBtn = document.getElementById('togglePassword');
        var passField = document.getElementById('password');
        if (toggleBtn && passField) {
            toggleBtn.addEventListener('click', function () {
                if (passField.type === 'password') {
                    passField.type = 'text';
                    this.style.opacity = '1';
                } else {
                    passField.type = 'password';
                    this.style.opacity = '0.5';
                }
            });
        }

        var loginForm = document.getElementById('loginForm');

        if (loginForm) {
            loginForm.addEventListener('submit', function (e) {
                e.preventDefault();
                var email = document.getElementById('email').value.trim();
                var password = document.getElementById('password').value.trim();
                var submitBtn = loginForm.querySelector('.btn-submit');

                if (!email || !password) {
                    showToast('Please fill in all fields', 'error');
                    return;
                }

                submitBtn.textContent = 'Signing in...';
                submitBtn.disabled = true;

                // Fake login logic
                setTimeout(function () {
                    var registered = localStorage.getItem('w4g_registered');

                    if (registered === 'true') {
                        var username = localStorage.getItem('w4g_username') || 'User';
                        showToast('Login successful! Welcome back, ' + username, 'success');
                        setTimeout(function () {
                            window.location.href = 'index-2.html';
                        }, 1000);
                    } else {
                        // Pretend to log in anyway for demo purposes
                        localStorage.setItem('w4g_registered', 'true');
                        localStorage.setItem('w4g_username', email.split('@')[0]);
                        localStorage.setItem('w4g_email', email);

                        showToast('Login successful! Welcome back!', 'success');
                        setTimeout(function () {
                            window.location.href = 'index-2.html';
                        }, 1000);
                    }
                }, 800);
            });
        }
    </script>
